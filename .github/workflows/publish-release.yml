name: Publish signed Android release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Run this workflow on a version tag such as v0.14."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Build signed APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret $name."
              exit 1
            fi
          done
          umask 077
          export ANDROID_KEYSTORE_PATH="$(mktemp "$RUNNER_TEMP/fors-signing.XXXXXXXX")"
          trap 'rm -f -- "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature and version
        shell: bash
        run: |
          tools="${ANDROID_HOME:?Android SDK not configured}/build-tools/34.0.0"
          apk="app/build/outputs/apk/release/app-release.apk"
          "$tools/apksigner" verify "$apk"
          manifest=$("$tools/aapt" dump badging "$apk")
          version_name=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" <<< "$manifest")
          if [[ "v$version_name" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::The release tag must match the APK versionName (v$version_name)."
            exit 1
          fi
          cp "$apk" "$RUNNER_TEMP/Fors-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/Fors-${GITHUB_REF_NAME}.apk" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --latest \
            --title "Fors ${GITHUB_REF_NAME#v}"
